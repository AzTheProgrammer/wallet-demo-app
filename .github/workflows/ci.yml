name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Strip generated code from coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --remove coverage/lcov.info '*.g.dart' '*.freezed.dart' '*.config.dart' -o coverage/lcov.info --ignore-errors unused

      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - run: flutter build apk --release

      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-web
          path: build/web
