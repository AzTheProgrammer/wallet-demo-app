name: wallet_app
description: A portfolio-grade South African banking wallet built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  bloc: ^9.2.1
  crypto: ^3.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.4
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.2.3
  injectable: ^2.7.1
  intl: ^0.20.3
  json_annotation: ^4.9.0
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  alchemist: ^0.14.1
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  injectable_generator: ^2.8.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
